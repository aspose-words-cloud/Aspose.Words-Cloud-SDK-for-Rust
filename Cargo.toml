[package]
name = "aspose-words-cloud"
version = "26.7.0"
edition = "2021"
rust-version = "1.88"
description = "Rust SDK for the Aspose.Words Cloud API"
homepage = "https://products.aspose.cloud/words/family"
documentation = "https://docs.rs/aspose-words-cloud"
readme = "README.md"
license = "MIT"
repository = "https://github.com/aspose-words-cloud/aspose-words-cloud-rust"
keywords = ["aspose", "words", "cloud", "sdk"]
categories = ["api-bindings"]
publish = ["crates-io"]
include = [
    "Cargo.toml",
    "src/**",
    "examples/**",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
erased-serde = "0.4"
futures-util = "0.3"
mime = "0.3"
multer = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }