[package]
name = "aspose-words-cloud-tests"
version = "26.7.0"
edition = "2021"
publish = false

[dependencies]
aspose-words-cloud = { path = ".." }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }